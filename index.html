<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfection Puzzle Game</title>
    <style>
        body {
            margin: 0;
            background: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        #game-container {
            width: 500px;
            height: 400px;
            background: #34495e;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .ui {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #f1c40f; }
        p { margin: 0; font-size: 14px; color: #bdc3c7; }
        
        .slot {
            width: 90px;
            height: 90px;
            border: 3px dashed #7f8c8d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
        }
        
        .item {
            width: 75px;
            height: 75px;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .item:active { cursor: grabbing; transform: scale(1.05); }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            height: 25px;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1 id="level-title">Level 1: Color Order</h1>
        <p>Drag each item into its matching slot to achieve perfection!</p>
    </div>

    <div id="game-container">
        <div id="slots-area" style="display: flex; gap: 20px;"></div>
        <div id="items-area" style="display: flex; gap: 20px; flex-direction: column;"></div>
    </div>

    <div id="message"></div>

    <script>
        // Data for multiple levels (Easily expandable up to 100+ levels)
        const levels = [
            {
                title: "Level 1: Primary Colors",
                items: [
                    { id: 'red', name: 'Red Gem', color: '#e74c3c' },
                    { id: 'blue', name: 'Blue Gem', color: '#3498db' },
                    { id: 'green', name: 'Green Gem', color: '#2ecc71' }
                ],
                slots: ['red', 'blue', 'green']
            },
            {
                title: "Level 2: Shape & Shade",
                items: [
                    { id: 'purple', name: 'Amethyst', color: '#9b59b6' },
                    { id: 'orange', name: 'Topaz', color: '#e67e22' },
                    { id: 'yellow', name: 'Citrine', color: '#f1c40f' }
                ],
                slots: ['orange', 'yellow', 'purple']
            },
            {
                title: "Level 3: Deep Elements",
                items: [
                    { id: 'dark', name: 'Obsidian', color: '#2c3e50' },
                    { id: 'teal', name: 'Diamond', color: '#1abc9c' },
                    { id: 'pink', name: 'Quartz', color: '#ff7675' }
                ],
                slots: ['pink', 'dark', 'teal']
            }
            // You can continue adding levels up to 100+ here!
        ];

        let currentLevel = 0;
        const slotsArea = document.getElementById('slots-area');
        const itemsArea = document.getElementById('items-area');
        const levelTitle = document.getElementById('level-title');
        const message = document.getElementById('message');

        function loadLevel(index) {
            if (index >= levels.length) {
                levelTitle.innerText = "Congratulations!";
                document.getElementById('game-container').innerHTML = "<h2 style='color:#f1c40f;'>You completed all available perfection levels!</h2>";
                return;
            }

            const lvl = levels[index];
            levelTitle.innerText = lvl.title;
            slotsArea.innerHTML = '';
            itemsArea.innerHTML = '';
            message.innerText = '';

            // Create randomized slots
            let targetSlots = [...lvl.slots];
            // Shuffle slots for a puzzle challenge
            targetSlots.sort(() => Math.random() - 0.5);

            targetSlots.forEach(slotId => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.target = slotId;
                
                // Visual indicator of target color
                const targetData = lvl.items.find(i => i.id === slotId);
                slot.style.borderColor = targetData.color;

                slot.addEventListener('dragover', (e) => e.preventDefault());
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedId = e.dataTransfer.getData('text/plain');
                    if (draggedId === slotId && slot.children.length === 0) {
                        const draggedElement = document.getElementById(draggedId);
                        slot.appendChild(draggedElement);
                        draggedElement.setAttribute('draggable', 'false');
                        checkWin();
                    }
                });

                slotsArea.appendChild(slot);
            });

            // Create randomized items to drag
            let shuffledItems = [...lvl.items].sort(() => Math.random() - 0.5);
            shuffledItems.forEach(itemData => {
                const item = document.createElement('div');
                item.className = 'item';
                item.id = itemData.id;
                item.innerText = itemData.name;
                item.style.backgroundColor = itemData.color;
                item.setAttribute('draggable', 'true');

                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', itemData.id);
                });

                itemsArea.appendChild(item);
            });
        }

        function checkWin() {
            const slots = document.querySelectorAll('.slot');
            let allFilled = true;
            slots.forEach(slot => {
                if (slot.children.length === 0) allFilled = false;
            });

            if (allFilled) {
                message.innerText = "✨ Perfect! Loading next level... ✨";
                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 1200);
            }
        }

        // Initialize game
        loadLevel(currentLevel);
    </script>
</body>
</html>
