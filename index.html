<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Drop & Merge Puzzle</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #16213e;
            border-radius: 12px;
            background: #0f3460;
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
        }
    </style>
</head>
<body>

    <div class="ui">Score: <span id="score">0</span></div>
    <div id="game-container"></div>

    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

        // Setup dimensions
        const width = 400;
        const height = 600;

        const engine = Engine.create();
        const world = engine.world;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: '#0f3460'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Create Container Boundaries
        const wallOptions = { isStatic: true, render: { fillStyle: '#1a1a2e' } };
        const ground = Bodies.rectangle(width / 2, height - 10, width, 20, wallOptions);
        const leftWall = Bodies.rectangle(10, height / 2, 20, height, wallOptions);
        const rightWall = Bodies.rectangle(width - 10, height / 2, 20, height, wallOptions);
        Composite.add(world, [ground, leftWall, rightWall]);

        // Item Tiers (Radius, Color, Label, Points)
        const itemsData = [
            { radius: 15, color: '#b8860b', name: 'Nugget', points: 2 },
            { radius: 22, color: '#c0c0c0', name: 'Iron', points: 4 },
            { radius: 30, color: '#ffd700', name: 'Gold', points: 8 },
            { radius: 40, color: '#00ffff', name: 'Diamond', points: 16 },
            { radius: 50, color: '#ff4500', name: 'TNT', points: 32 }
        ];

        let score = 0;
        let currentTier = 0;
        let canDrop = true;
        let dropX = width / 2;

        // Mouse movement for dropping
        const container = document.getElementById('game-container');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            dropX = e.clientX - rect.left;
            dropX = Math.max(45, Math.min(width - 45, dropX));
        });

        container.addEventListener('click', () => {
            if (!canDrop) return;
            canDrop = false;

            spawnItem(dropX, 50, currentTier);
            currentTier = Math.floor(Math.random() * 3); // Randomly drop lower tiers

            setTimeout(() => {
                canDrop = true;
            }, 600);
        });

        function spawnItem(x, y, tier) {
            const data = itemsData[tier];
            const body = Bodies.circle(x, y, data.radius, {
                restitution: 0.3,
                friction: 0.2,
                render: { fillStyle: data.color }
            });
            body.tier = tier;
            Composite.add(world, body);
        }

        // Collision merging logic
        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                if (bodyA.tier !== undefined && bodyA.tier === bodyB.tier) {
                    const tier = bodyA.tier;
                    if (tier < itemsData.length - 1) {
                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;

                        // Remove old bodies
                        Composite.remove(world, bodyA);
                        Composite.remove(world, bodyB);

                        // Spawn next tier
                        spawnItem(midX, midY, tier + 1);

                        // Update Score
                        score += itemsData[tier].points * 2;
                        document.getElementById('score').innerText = score;
                    }
                }
            });
        });
    </script>
</body>
</html>
