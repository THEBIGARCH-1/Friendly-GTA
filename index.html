<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Master: Multi-Puzzle Challenge</title>
    <style>
        body {
            margin: 0;
            background: #1b1b2f;
            color: #eaeaea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        #game-board {
            width: 600px;
            height: 400px;
            background: #162447;
            border: 6px solid #1f4068;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }
        .header-ui {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #e43f5a; }
        p { margin: 0; font-size: 14px; color: #a4b3b6; }
        
        /* Puzzle 1: Shape Fitting */
        .shape-container { display: flex; gap: 20px; width: 100%; justify-content: space-around; }
        .slot, .piece {
            width: 110px; height: 90px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; text-align: center;
        }
        .slot { border: 3px dashed #e43f5a; background: rgba(228, 63, 90, 0.1); }
        .piece { background: #e43f5a; color: white; cursor: grab; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Puzzle 2: Wire Connecting */
        .wire-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .wire-row { display: flex; justify-content: space-between; align-items: center; background: #1f4068; padding: 10px 15px; border-radius: 8px; }
        .wire-btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }

        /* Puzzle 3: Word Unscramble */
        .letter-container { display: flex; gap: 12px; margin-top: 20px; }
        .letter-tile {
            width: 50px; height: 50px; background: #0f4c81; border: 2px solid #5bc0be;
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; cursor: pointer; color: white;
        }
        .target-box { display: flex; gap: 10px; min-height: 60px; align-items: center; margin-bottom: 15px; }
        .drop-spot { width: 50px; height: 50px; border: 2px dashed #eaeaea; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }

        #message { margin-top: 15px; font-size: 16px; font-weight: bold; color: #4ecca3; height: 25px; }
    </style>
</head>
<body>

    <div class="header-ui">
        <h1 id="puzzle-title">Puzzle 1: Wood Shape Fitting</h1>
        <p id="puzzle-instructions">Drag the correct timber shapes into their designated slots.</p>
    </div>

    <div id="game-board"></div>
    <div id="message"></div>

    <script>
        let currentStage = 1;
        const board = document.getElementById('game-board');
        const title = document.getElementById('puzzle-title');
        const instructions = document.getElementById('puzzle-instructions');
        const message = document.getElementById('message');

        function loadStage(stage) {
            board.innerHTML = '';
            message.innerHTML = '';

            if (stage === 1) {
                // PUZZLE 1: Shape Fitting (Grid/Row based)
                title.innerText = "Puzzle 1: Timber Shape Fitting";
                instructions.innerText = "Match the customized blocks to their correct cutout profiles.";

                let container = document.createElement('div');
                container.className = 'shape-container';
                
                let slotsDiv = document.createElement('div');
                slotsDiv.style.display = "flex"; slotsDiv.style.flexDirection = "column"; slotsDiv.style.gap = "10px";
                let piecesDiv = document.createElement('div');
                piecesDiv.style.display = "flex"; piecesDiv.style.flexDirection = "column"; piecesDiv.style.gap = "10px";

                let shapes = [
                    { id: 'sq', name: 'Square Block' },
                    { id: 'tri', name: 'Triangle Wedge' },
                    { id: 'cir', name: 'Cylinder Dowel' }
                ];

                let shuffledShapes = [...shapes].sort(() => Math.random() - 0.5);

                shapes.forEach(s => {
                    let slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.dataset.target = s.id;
                    slot.innerText = `Slot: ${s.name}`;
                    slot.addEventListener('dragover', e => e.preventDefault());
                    slot.addEventListener('drop', e => {
                        e.preventDefault();
                        let id = e.dataTransfer.getData('text');
                        if (id === s.id && slot.children.length === 0) {
                            slot.appendChild(document.getElementById(id));
                            checkPuzzle1Win();
                        }
                    });
                    slotsDiv.appendChild(slot);
                });

                shuffledShapes.forEach(s => {
                    let piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.id = s.id;
                    piece.innerText = s.name;
                    piece.setAttribute('draggable', 'true');
                    piece.addEventListener('dragstart', e => e.dataTransfer.setData('text', s.id));
                    piecesDiv.appendChild(piece);
                });

                container.appendChild(slotsDiv);
                container.appendChild(piecesDiv);
                board.appendChild(container);

            } else if (stage === 2) {
                // PUZZLE 2: Circuit / Wire Connection
                title.innerText = "Puzzle 2: Workshop Circuit Link";
                instructions.innerText = "Connect the matching colored wires to power up the table saw.";

                let grid = document.createElement('div');
                grid.className = 'wire-grid';

                let colors = [
                    { name: 'Power Line (Red)', color: '#e43f5a', connected: false },
                    { name: 'Ground Line (Blue)', color: '#3a86ff', connected: false },
                    { name: 'Safety Line (Green)', color: '#38b000', connected: false }
                ];

                colors.sort(() => Math.random() - 0.5);

                colors.forEach((c, index) => {
                    let row = document.createElement('div');
                    row.className = 'wire-row';
                    
                    let label = document.createElement('span');
                    label.innerText = c.name;
                    label.style.fontWeight = 'bold';

                    let btn = document.createElement('button');
                    btn.className = 'wire-btn';
                    btn.style.backgroundColor = c.color;
                    btn.innerText = "Link Wire";
                    
                    btn.onclick = () => {
                        btn.innerText = "Linked ✓";
                        btn.style.backgroundColor = "#555";
                        btn.disabled = true;
                        c.connected = true;
                        
                        if (colors.every(item => item.connected)) {
                            message.innerText = "⚡ Power Restored! Loading next puzzle... ⚡";
                            setTimeout(() => { currentStage++; loadStage(currentStage); }, 1400);
                        }
                    };

                    row.appendChild(label);
                    row.appendChild(btn);
                    grid.appendChild(row);
                });

                board.appendChild(grid);

            } else if (stage === 3) {
                // PUZZLE 3: Word Unscramble (Wood Tool)
                title.innerText = "Puzzle 3: Carpentry Word Unscramble";
                instructions.innerText = "Click the letters in the correct order to spell the tool: **CHISEL**";

                let targetWord = "CHISEL";
                let scrambled = "LIHSCE".split('').sort(() => Math.random() - 0.5);
                
                let targetBox = document.createElement('div');
                targetBox.className = 'target-box';
                let currentInput = [];

                for (let i = 0; i < targetWord.length; i++) {
                    let spot = document.createElement('div');
                    spot.className = 'drop-spot';
                    spot.id = `spot-${i}`;
                    targetBox.appendChild(spot);
                }
                board.appendChild(targetBox);

                let letterContainer = document.createElement('div');
                letterContainer.className = 'letter-container';

                scrambled.forEach((char, index) => {
                    let tile = document.createElement('div');
                    tile.className = 'letter-tile';
                    tile.innerText = char;
                    tile.onclick = () => {
                        if (currentInput.length < targetWord.length) {
                            currentInput.push(char);
                            tile.style.visibility = 'hidden';
                            tile.dataset.used = "true";
                            
                            // Update display spot
                            document.getElementById(`spot-${currentInput.length - 1}`).innerText = char;

                            if (currentInput.length === targetWord.length) {
                                let formed = currentInput.join('');
                                if (formed === targetWord) {
                                    message.innerText = "🔨 Word Solved! Workshop Mastered! 🔨";
                                } else {
                                    message.innerText = "❌ Incorrect spelling, resetting...";
                                    setTimeout(() => loadStage(3), 1200);
                                }
                            }
                        }
                    };
                    letterContainer.appendChild(tile);
                });

                board.appendChild(letterContainer);
            }
        }

        function checkPuzzle1Win() {
            let slots = document.querySelectorAll('.slot');
            let filled = true;
            slots.forEach(s => { if (s.children.length === 0) filled = false; });
            if (filled) {
                message.innerText = "✨ Perfect Fit! Loading next puzzle... ✨";
                setTimeout(() => { currentStage++; loadStage(currentStage); }, 1400);
            }
        }

        // Start game
        loadStage(currentStage);
    </script>
</body>
</html>
