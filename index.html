<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Morty Face Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="instructions">Click and drag anywhere on Morty's face to stretch and squish!</div>

    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting to give 3D depth to Morty's face
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x77bbff, 0.4);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // --- 2. CREATE ELASTIC MORTY HEAD MESH ---
        // High density sphere mesh to allow vertex stretching physics
        const geometry = new THREE.SphereGeometry(1.6, 32, 32);
        
        // Save original vertex positions to calculate elastic snap-back spring forces
        const positionAttribute = geometry.attributes.position;
        const originalPositions = [];
        for (let i = 0; i < positionAttribute.count; i++) {
            originalPositions.push(new THREE.Vector3(
                positionAttribute.getX(i),
                positionAttribute.getY(i),
                positionAttribute.getZ(i)
            ));
        }

        // Canvas texture generator for Morty's iconic face features
        function createMortyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Skin background (Morty's peach tone)
            ctx.fillStyle = '#ffdfb1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Hair (Brown messy tufts on top)
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.arc(512, 180, 240, Math.PI, 0, false);
            ctx.fill();
            // Hair spikes overlay
            ctx.beginPath();
            ctx.moveTo(300, 200); ctx.lineTo(250, 100); ctx.lineTo(380, 150);
            ctx.lineTo(512, 80); ctx.lineTo(644, 150); ctx.lineTo(774, 100); ctx.lineTo(724, 200);
            ctx.fill();

            // Big Goofy Eyes (White circles with black pupils)
            // Left Eye
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(400, 480, 110, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Right Eye
            ctx.beginPath();
            ctx.arc(624, 480, 110, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Pupils (Anxious black dots)
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(420, 480, 30, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(604, 480, 30, 0, Math.PI * 2); ctx.fill();

            // Nose (Classic rounded bump)
            ctx.strokeStyle = '#b8860b';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(512, 570, 45, 0.2, Math.PI - 0.2, false);
            ctx.stroke();

            // Anxious Morty Mouth (Wavy line / open panic mouth)
            ctx.fillStyle = '#660000';
            ctx.beginPath();
            ctx.ellipse(512, 730, 70, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Rosy Cheeks
            ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
            ctx.beginPath(); ctx.arc(310, 600, 60, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(714, 600, 60, 0, Math.PI * 2); ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.MeshStandardMaterial({
            map: createMortyTexture(),
            roughness: 0.4,
            metalness: 0.1
        });

        const mortyHead = new THREE.Mesh(geometry, material);
        scene.add(mortyHead);

        // --- 3. INTERACTION & SOFT-BODY ELASTIC PHYSICS ---
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isDragging = false;
        let selectedVertexIndex = null;
        let dragPlane = new THREE.Plane();
        let intersectionPoint = new THREE.Vector3();

        window.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mortyHead);

            if (intersects.length > 0) {
                isDragging = true;
                const intersect = intersects[0];
                
                // Find closest vertex to click point for elastic dragging
                const posAttr = mortyHead.geometry.attributes.position;
                let closestDist = Infinity;
                let closestIdx = 0;

                const localPoint = mortyHead.worldToLocal(intersect.point.clone());

                for (let i = 0; i < posAttr.count; i++) {
                    const vx = posAttr.getX(i);
                    const vy = posAttr.getY(i);
                    const vz = posAttr.getZ(i);
                    const dist = Math.hypot(vx - localPoint.x, vy - localPoint.y, vz - localPoint.z);
                    if (dist < closestDist) {
                        closestDist = dist;
                        closestIdx = i;
                    }
                }

                selectedVertexIndex = closestIdx;
                dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), intersect.point);
            }
        });

        window.addEventListener('pointermove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isDragging && selectedVertexIndex !== null) {
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(dragPlane, intersectionPoint);
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            selectedVertexIndex = null;
        });

        // --- 4. GAME LOOP & SPRING PHYSICS ---
        function animate() {
            requestAnimationFrame(animate);

            const posAttr = mortyHead.geometry.attributes.position;

            // Optional subtle idle breathing rotation
            if (!isDragging) {
                mortyHead.rotation.y = Math.sin(Date.now() * 0.002) * 0.1;
                mortyHead.rotation.x = Math.cos(Date.now() * 0.0015) * 0.05;
            }

            // Vertex deformation simulation loop
            for (let i = 0; i < posAttr.count; i++) {
                const orig = originalPositions[i];
                
                // Current position in world space transformed back or simulated directly
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                let vz = posAttr.getZ(i);

                let currentPos = new THREE.Vector3(vx, vy, vz);

                if (isDragging && selectedVertexIndex !== null) {
                    // Pull vertices near the grabbed node (Soft-body radius falloff)
                    const grabbedOrig = originalPositions[selectedVertexIndex];
                    const distToGrab = orig.distanceTo(grabbedOrig);
                    const influenceRadius = 1.2;

                    if (distToGrab < influenceRadius) {
                        let factor = 1 - (distToGrab / influenceRadius);
                        let localTarget = mortyHead.worldToLocal(intersectionPoint.clone());
                        
                        let targetX = THREE.MathUtils.lerp(orig.x, localTarget.x, factor);
                        let targetY = THREE.MathUtils.lerp(orig.y, localTarget.y, factor);
                        let targetZ = THREE.MathUtils.lerp(orig.z, localTarget.z, factor);

                        currentPos.x += (targetX - currentPos.x) * 0.4;
                        currentPos.y += (targetY - currentPos.y) * 0.4;
                        currentPos.z += (targetZ - currentPos.z) * 0.4;
                    }
                }

                // Spring physics snap back to original anatomical position
                currentPos.x += (orig.x - currentPos.x) * 0.12;
                currentPos.y += (orig.y - currentPos.y) * 0.12;
                currentPos.z += (orig.z - currentPos.z) * 0.12;

                posAttr.setXYZ(i, currentPos.x, currentPos.y, currentPos.z);
            }

            posAttr.needsUpdate = true;
            mortyHead.geometry.computeVertexNormals();

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing cleanly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
