<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly City Sandbox - Large Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #7ecef4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #2c3e50; }
        p { margin: 3px 0; font-size: 14px; color: #34495e; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Friendly City Sandbox (Big Map)</h1>
        <p><b>W, A, S, D</b> to drive your car across the expanded city</p>
    </div>

    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ecef4);
        scene.fog = new THREE.Fog(0x7ecef4, 50, 250);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 80, 50);
        scene.add(sunLight);

        // --- 2. LARGE CITY ENVIRONMENT ---
        const mapSize = 600;
        const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x5cba47 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Expanded City Road Grid
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        for (let i = -250; i <= 250; i += 50) {
            const roadX = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 16), roadMat);
            roadX.rotation.x = -Math.PI / 2;
            roadX.position.set(0, 0.01, i);
            scene.add(roadX);

            const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(16, mapSize), roadMat);
            roadZ.rotation.x = -Math.PI / 2;
            roadZ.position.set(i, 0.02, 0);
            scene.add(roadZ);
        }

        // Dense Buildings Generation
        const buildingColors = [0xff6b6b, 0x48dbfb, 0x1dd1a1, 0xfeca57, 0xff9ff3, 0x54a0ff, 0xff6b81, 0x7bed9f];
        for (let x = -225; x <= 225; x += 50) {
            for (let z = -225; z <= 225; z += 50) {
                if (Math.abs(x) < 25 || Math.abs(z) < 25) continue; // Keep central crossroads clear

                const width = 28;
                const depth = 28;
                const height = 20 + Math.random() * 45;
                const bGeo = new THREE.BoxGeometry(width, height, depth);
                const bMat = new THREE.MeshLambertMaterial({ color: buildingColors[Math.floor(Math.random() * buildingColors.length)] });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(x, height / 2, z);
                scene.add(building);
            }
        }

        // --- 3. PEDESTRIANS ---
        const pedestrians = [];
        const pedGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const pedMat = new THREE.MeshLambertMaterial({ color: 0xff9f43 });

        for (let i = 0; i < 40; i++) {
            const ped = new THREE.Mesh(pedGeo, pedMat);
            ped.position.set((Math.random() - 0.5) * 400, 1, (Math.random() - 0.5) * 400);
            ped.userData = { 
                direction: new THREE.Vector3((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize(),
                speed: 0.04 + Math.random() * 0.04 
            };
            scene.add(ped);
            pedestrians.push(ped);
        }

        // --- 4. PLAYER CAR ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        const carBodyGeo = new THREE.BoxGeometry(2.2, 1.1, 4.2);
        const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xff4757 });
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        carBody.position.y = 0.8;
        carGroup.add(carBody);

        const carRoofGeo = new THREE.BoxGeometry(1.8, 0.9, 2.0);
        const carRoofMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const carRoof = new THREE.Mesh(carRoofGeo, carRoofMat);
        carRoof.position.set(0, 1.7, -0.2);
        carGroup.add(carRoof);

        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        wheelGeo.rotateZ(Math.PI / 2);

        const wheelPositions = [
            [-1.2, 0.4, 1.4], [1.2, 0.4, 1.4],
            [-1.2, 0.4, -1.4], [1.2, 0.4, -1.4]
        ];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        carGroup.position.set(0, 0, 15);

        // --- 5. CONTROLS ---
        let keys = { w: false, a: false, s: false, d: false };
        let speed = 0;
        let steering = 0;
        const maxSpeed = 0.45;
        const acceleration = 0.015;
        const friction = 0.96;

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') keys.w = true;
            if (e.key.toLowerCase() === 's') keys.s = true;
            if (e.key.toLowerCase() === 'a') keys.a = true;
            if (e.key.toLowerCase() === 'd') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'w') keys.w = false;
            if (e.key.toLowerCase() === 's') keys.s = false;
            if (e.key.toLowerCase() === 'a') keys.a = false;
            if (e.key.toLowerCase() === 'd') keys.d = false;
        });

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (keys.w) speed = Math.min(speed + acceleration, maxSpeed);
            if (keys.s) speed = Math.max(speed - acceleration, -maxSpeed * 0.5);

            speed *= friction;

            if (keys.a) steering += 0.035;
            if (keys.d) steering -= 0.035;

            if (Math.abs(speed) > 0.01) {
                carGroup.rotation.y += steering * (speed > 0 ? 1 : -1);
            }

            carGroup.translateZ(speed);

            // Pedestrian Movement & Loop
            pedestrians.forEach(ped => {
                ped.position.addScaledVector(ped.userData.direction, ped.userData.speed);
                if (Math.abs(ped.position.x) > 280 || Math.abs(ped.position.z) > 280) {
                    ped.userData.direction.negate();
                }
            });

            // Smooth Chase Camera
            let targetCamPos = new THREE.Vector3(
                carGroup.position.x - Math.sin(carGroup.rotation.y) * 14,
                carGroup.position.y + 7,
                carGroup.position.z - Math.cos(carGroup.rotation.y) * 14
            );
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
