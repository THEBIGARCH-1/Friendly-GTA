<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timber Craft: Precision Wood Puzzles</title>
    <style>
        body {
            margin: 0;
            background: #1e1512;
            color: #f4e8c1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        #workbench {
            width: 650px;
            height: 420px;
            background: #8b5a2b; /* Wood workbench surface */
            border: 8px solid #3d2314;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }
        .header-ui {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; color: #d4a373; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        p { margin: 0; font-size: 14px; color: #bc6c25; font-weight: bold; }
        
        .board-section {
            width: 45%;
            height: 100%;
            background: #a67c52;
            border: 4px dashed #5c4033;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 15px;
            position: relative;
        }
        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #3d2314;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slots-container, .pieces-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }
        
        .wood-slot {
            width: 95%;
            height: 55px;
            background: #5c4033; /* Dark cutout slot */
            border: 2px inset #3d2314;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
        }
        
        .wood-piece {
            width: 95%;
            height: 55px;
            background: #d4a373; /* Natural timber piece */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 2px, transparent 0, transparent 4px);
            border: 2px solid #b5838d;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #3d2314;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .wood-piece:active { cursor: grabbing; transform: scale(1.02); }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #606c38;
            height: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-ui">
        <h1 id="level-title">Carpentry Level 1: Plank Assembly</h1>
        <p>Fit the custom-cut timber blocks perfectly into their routed workbench slots.</p>
    </div>

    <div id="workbench">
        <!-- Left Side: Routed Slots -->
        <div class="board-section">
            <span class="section-title">Workbench Template</span>
            <div class="slots-container" id="slots-area"></div>
        </div>

        <!-- Right Side: Timber Pieces -->
        <div class="board-section">
            <span class="section-title">Raw Timber Stack</span>
            <div class="pieces-container" id="pieces-area"></div>
        </div>
    </div>

    <div id="message"></div>

    <script>
        // Wood-themed puzzle stages (Easily expandable up to 100+ levels)
        const levels = [
            {
                title: "Carpentry Level 1: Plank Assembly",
                pieces: [
                    { id: 'beam', name: 'Support Beam (Long)', shape: 'Rectangle' },
                    { id: 'wedge', name: 'Corner Wedge', shape: 'Triangle Cut' },
                    { id: 'peg', name: 'Anchor Dowel', shape: 'Cylinder Block' }
                ],
                slots: ['beam', 'wedge', 'peg']
            },
            {
                title: "Carpentry Level 2: Joint Precision",
                pieces: [
                    { id: 'mortise', name: 'Mortise Joint', shape: 'Notched Timber' },
                    { id: 'tenon', name: 'Tenon Lock', shape: 'Stepped Block' },
                    { id: 'batten', name: 'Oak Batten', shape: 'Crossbeam' }
                ],
                slots: ['tenon', 'mortise', 'batten']
            },
            {
                title: "Carpentry Level 3: Structural Framing",
                pieces: [
                    { id: 'truss', name: 'Roof Truss', shape: 'A-Frame Beam' },
                    { id: 'stud', name: 'Wall Stud', shape: 'Vertical Timber' },
                    { id: 'sill', name: 'Base Sill Plate', shape: 'Plate Timber' }
                ],
                slots: ['stud', 'truss', 'sill']
            }
        ];

        let currentLevel = 0;
        const slotsArea = document.getElementById('slots-area');
        const piecesArea = document.getElementById('pieces-area');
        const levelTitle = document.getElementById('level-title');
        const message = document.getElementById('message');

        function loadLevel(index) {
            if (index >= levels.length) {
                levelTitle.innerText = "Master Carpenter Achievement Unlocked!";
                document.getElementById('workbench').innerHTML = "<h2 style='color:#d4a373; text-align:center; width:100%'>You successfully built all timber structures with absolute precision!</h2>";
                return;
            }

            const lvl = levels[index];
            levelTitle.innerText = lvl.title;
            slotsArea.innerHTML = '';
            piecesArea.innerHTML = '';
            message.innerText = '';

            // Randomize slot layout order for puzzle challenge
            let targetSlots = [...lvl.slots];
            targetSlots.sort(() => Math.random() - 0.5);

            targetSlots.forEach(slotId => {
                const slot = document.createElement('div');
                slot.className = 'wood-slot';
                slot.dataset.target = slotId;
                
                slot.addEventListener('dragover', (e) => e.preventDefault());
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedId = e.dataTransfer.getData('text/plain');
                    if (draggedId === slotId && slot.children.length === 0) {
                        const draggedElement = document.getElementById(draggedId);
                        slot.appendChild(draggedElement);
                        draggedElement.setAttribute('draggable', 'false');
                        draggedElement.style.width = "100%";
                        draggedElement.style.height = "100%";
                        checkWin();
                    }
                });

                slotsArea.appendChild(slot);
            });

            // Randomize raw timber stack order
            let shuffledPieces = [...lvl.pieces].sort(() => Math.random() - 0.5);
            shuffledPieces.forEach(pieceData => {
                const piece = document.createElement('div');
                piece.className = 'wood-piece';
                piece.id = pieceData.id;
                piece.innerText = `${pieceData.name} [${pieceData.shape}]`;
                piece.setAttribute('draggable', 'true');

                piece.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', pieceData.id);
                });

                piecesArea.appendChild(piece);
            });
        }

        function checkWin() {
            const slots = document.querySelectorAll('.wood-slot');
            let allFilled = true;
            slots.forEach(slot => {
                if (slot.children.length === 0) allFilled = false;
            });

            if (allFilled) {
                message.innerText = "🪚 Precise Fit! Securing timber & loading next blueprint... 🪚";
                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 1300);
            }
        }

        // Initialize puzzle framework
        loadLevel(currentLevel);
    </script>
</body>
</html>
