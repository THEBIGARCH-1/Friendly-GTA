<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Satisfying Studio: Pop-It, Slime & Tie-Dye</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            margin: 15px 0;
        }
        h1 { margin: 0; font-size: 24px; color: #ff758c; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        p { margin: 5px 0 0 0; font-size: 14px; color: #a2a8d3; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: #162447;
            color: #fff;
            border: 2px solid #1f4068;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #ff758c;
            border-color: #ff758c;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        .studio-container {
            width: 500px;
            height: 420px;
            background: #162447;
            border: 4px solid #1f4068;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Pop It Styles */
        .pop-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .pop-bubble {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #ff9a8b, #ff6a88);
            border-radius: 50%;
            border: none;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.6), 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pop-bubble.popped {
            background: radial-gradient(circle at 70% 70%, #ff6a88, #b721ff);
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
            transform: scale(0.92);
        }

        /* Slime Styles */
        #slime-canvas {
            width: 100%;
            height: 100%;
            cursor: pointer;
            border-radius: 10px;
        }

        /* Tie-Dye Styles */
        .tie-dye-swatch {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9b59b6, #ff4757);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            animation: spinSwirl 10s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tie-dye-inner {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #ffffff, #ff6b81);
            border-radius: 50%;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }
        @keyframes spinSwirl {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn:hover { background: #e94560; }
    </style>
</head>
<body>

    <header>
        <h1>Satisfying ASMR Studio</h1>
        <p>Pop-it bubbles, squishy slime, and dynamic tie-dye patterns!</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('popit')">Pop-It</button>
        <button class="tab-btn" onclick="switchTab('slime')">Squishy Slime</button>
        <button class="tab-btn" onclick="switchTab('tiedye')">Tie-Dye Wheel</button>
    </div>

    <div class="studio-container" id="studio">
        <!-- Dynamic Content Injected Here -->
    </div>

    <div class="controls" id="controls-area">
        <button class="action-btn" onclick="resetStudio()">Reset / Mix</button>
    </div>

    <script>
        let currentMode = 'popit';

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderStudio();
        }

        function renderStudio() {
            const studio = document.getElementById('studio');
            studio.innerHTML = '';

            if (currentMode === 'popit') {
                let grid = document.createElement('div');
                grid.className = 'pop-grid';
                for (let i = 0; i < 12; i++) {
                    let bubble = document.createElement('button');
                    bubble.className = 'pop-bubble';
                    bubble.onclick = () => {
                        bubble.classList.toggle('popped');
                        playPopSound();
                    };
                    grid.appendChild(bubble);
                }
                studio.appendChild(grid);
            } 
            else if (currentMode === 'slime') {
                let canvas = document.createElement('canvas');
                canvas.id = 'slime-canvas';
                studio.appendChild(canvas);
                initSlime(canvas);
            } 
            else if (currentMode === 'tiedye') {
                let wrap = document.createElement('div');
                wrap.className = 'tie-dye-swatch';
                let inner = document.createElement('div');
                inner.className = 'tie-dye-inner';
                wrap.appendChild(inner);
                studio.appendChild(wrap);
            }
        }

        // Simple Web Audio API pop sound generator
        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        // Slime Interactive Blob Simulation
        function initSlime(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            let blobX = canvas.width / 2;
            let blobY = canvas.height / 2;
            let radius = 90;
            let targetRadius = 90;
            let squishColor = '#ff758c';

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                let mouseX = e.clientX - rect.left;
                let mouseY = e.clientY - rect.top;
                let dist = Math.hypot(mouseX - blobX, mouseY - blobY);
                if (dist < radius) {
                    targetRadius = 115;
                } else {
                    targetRadius = 90;
                }
            });

            canvas.addEventListener('mouseleave', () => { targetRadius = 90; });
            canvas.addEventListener('click', () => {
                targetRadius = 60;
                squishColor = '#' + Math.floor(Math.random()*16777215).toString(16);
                setTimeout(() => targetRadius = 90, 150);
            });

            function animateSlime() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                radius += (targetRadius - radius) * 0.15;

                ctx.fillStyle = squishColor;
                ctx.beginPath();
                ctx.arc(blobX, blobY, radius, 0, Math.PI * 2);
                ctx.shadowBlur = 20;
                ctx.shadowColor = squishColor;
                ctx.fill();
                ctx.shadowBlur = 0;

                requestAnimationFrame(animateSlime);
            }
            animateSlime();
        }

        function resetStudio() {
            renderStudio();
        }

        // Initial Load
        renderStudio();
    </script>
</body>
</html>
